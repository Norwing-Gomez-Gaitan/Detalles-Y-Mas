version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: detalles_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: manualidades
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:

